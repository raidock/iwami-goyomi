name: 石見暦を収集して公開

on:
  schedule:
    - cron: "0 21 * * *"     # 毎朝 JST 6:00
  push:
    branches: [main]          # コード修正・承認をpushしたら再生成する
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt

      # push のときは収集しない。生成と公開だけ行う。
      # 情報源に余計な負荷をかけず、ボットのpushで自分が回り続けるのも防ぐ。
      - name: 収集
        if: github.event_name != 'push'
        run: python main.py collect --data-dir ./data

      - name: サイト生成
        run: python main.py build --data-dir ./data

      - name: 変更を保存
     m"
          git add data out
          git diff --staged --quiet || git commit -m "chore: 収集 $(date +%Y-%m-%d)"
          git pull --rebase origin main || true
          git push

      - name: 情報源の健康診断
        if: github.event_name != 'push'
        run: python main.py health

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: out }

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
