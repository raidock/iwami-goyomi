name: 石見暦を収集して公開

on:
  schedule:
    - cron: "0 21 * * *"     # 毎朝 JST 6:00
  push:
    branches: [main]          # コード修正・承認をpushしたら再生成する
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt

      # push のときは収集しない。生成と公開だけ行う。
      # 情報源に余計な負荷をかけず、ボットのpushで自分が回り続けるのも防ぐ。
      - name: 収集
        if: github.event_name != 'push'
        run: python main.py collect --data-dir ./data

      - name: サイト生成
        run: python main.py build --data-dir ./data

      - name: 変更を保存
        run: |
          git config user.name  "iwami-goyomi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data out
          git diff --staged --quiet || git commit -m "chore: 収集 $(date +%Y-%m-%d)"
          git pull --rebase origin main || true
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: out }

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 情報源が静かに壊れたことを知らせるだけのジョブ。collect / deploy とは
  # 別ジョブに分けている。かつては collect の中の1ステップで、失敗すると
  # `deploy` が `needs: collect` で待つ作りのせいで公開ごと止まっていた
  # （2026-08-08、川本町観光協会が一時的に0件になり公開が止まった）。
  # 「知らせる」ためのものが「止める」ものになっていたのを分離した。
  # health が落ちても collect・deploy の合否には影響しない。
  # ワークフロー全体としては失敗表示になり、通知は届く（知らせる側は保つ）。
  health:
    needs: collect
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: 情報源の健康診断
        run: python main.py health
