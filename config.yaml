# 石見イベントコレクター 設定 (Phase 0)
home_base: 浜田

# ---- 公開サイトの設定 --------------------------------------------------
# contact は必ず埋めてください。公開物には連絡先が要ります。
# 「掲載をやめてほしい」という連絡を受ける窓口がないまま公開してはいけません。
site:
  title: 石見暦
  reading: いわみごよみ # 見出しにふりがなを振る（空にすると出ません）
  title_accent: 暦 # この文字だけ石州瓦の色で強調します
  tagline: 石見の催しと締切を、ひとつの暦に。
  # 例: https://<ユーザー名>.github.io/<リポジトリ名>/   OGP画像や共有に使います
  url: 'https://raidock.github.io/iwami-goyomi/'
  # 例: メールアドレス、問い合わせフォームのURL、SNSアカウント
  contact: 'https://forms.gle/5ayQ1xFfUFX9kva69'
  # 運営者の名乗り。公開するなら誰がやっているか示したほうが信頼されます
  operator: 'TandN Design'
region_name: 石見
out_dir: out
data_dir: data # git が保持するのでコードと一緒に動く。GitHub Actions と同じ置き場

# 掲載日がこれより古い記事は捨てる（RSSに古い記事が残り続けるため）。
# 各情報源で max_age_days を書けばそこだけ上書きできる。
# **全体を伸ばさないこと。** 浜田市の公式RSSには2022年のコロナ情報が残っていた。
max_age_days: 400

# 取得の間隔（秒）。相手のサーバに負荷をかけないための待ち時間。全体の既定値。
# 各情報源で fetch_delay_sec を書けばそこだけ上書きできる。
# robots.txt が Crawl-delay を宣言しているサイトは、その値をその情報源にだけ書く
# （全体を上げると関係のない情報源まで遅くなり、収集が終わらなくなる）。
fetch_delay_sec: 1.0

# 石見9市町のうち4市（浜田・江津・益田・大田）。邑南町は観光協会だけ入れてある。
# 残りは邑南（公式）・川本・美郷・津和野・吉賀。
# feed_url を省略するとトップページから自動発見する。
municipalities:
  - key: hamada_city
    municipality: 浜田市
    site: https://www.city.hamada.shimane.jp
    feed_url: https://www.city.hamada.shimane.jp/www/rss/news.rdf
  - key: gotsu_city
    municipality: 江津市
    site: https://www.city.gotsu.lg.jp
    feed_url: https://www.city.gotsu.lg.jp/rss/10/list1.xml # 新着情報（本文の<a>にあり自動発見が届かなかったため明示）
  - key: masuda_city
    municipality: 益田市
    site: https://www.city.masuda.lg.jp
    feed_url: https://www.city.masuda.lg.jp/cgi-bin/feed.php?siteNew=1 # クエリ形式のためFEED_HREF_REに掛からず明示（リンク自体は //host 形式）
  # ドメインは oda。ohda ではない（www.city.ohda.lg.jp は名前解決できない）
  - key: oda_city
    municipality: 大田市
    site: https://www.city.oda.lg.jp
    # /feed/ は新着フィードではなく**サイト全体の目次**。907件のうち大半が
    # 組織案内などの固定ページで、<pubDate> を1件も持たない。
    # そのため専用アダプター OdaCityRSS が新着一覧HTMLから掲載日を補う
    # （差し替えは main.py の ADAPTERS。詳細は collector/sources/oda_city.py）
    feed_url: https://www.city.oda.lg.jp/feed/
    # 記事だけに絞る。末尾の [^/?#] が索引ページ /update_info/ そのものと
    # ページ送り（?page=2）を外す。記事URLは連番だけでなく /update_info/guidebook
    # のような名前つきもあるので、数字に限定してはいけない（4件取りこぼした）
    url_include: '/update_info/[^/?#]'
    fetch_delay_sec: 5 # robots.txt の Crawl-delay: 5（石見で宣言しているのはここだけ）

# 観光協会。イベント専用のRSSなのでノイズが少なく、trust: high で扱う。
# （自治体と同じ厳しさで仕分けると、語彙にない催しを取りこぼすため）
tourism:
  - key: hamanavi
    municipality: 浜田市
    site: https://kankou-hamada.or.jp
    feed_url: https://kankou-hamada.or.jp/archives/category/event/feed/
    organizer_type: 観光協会
    trust: high
    # **窓が10件しかなく、投稿が多いので約2週間分しか見えない。**
    # 浜田市最大の祭り（浜っ子夏まつり・7/2投稿）が窓から落ちて載らなかった。
    # 3ページで30件＝約6週間分。負荷は1日2リクエスト増（設計判断12の範囲）
    feed_pages: 3
  - key: gotsu_kanko
    municipality: 江津市
    site: https://www.gotsu-kanko.jp
    organizer_type: 観光協会
    trust: high
    # サイト全体のRSSしかないため、お知らせ記事だけに絞る
    # （/kankou/see/ などの観光スポット紹介ページを除外）
    url_include: '/news/'
    feed_pages: 3 # 窓9件。いまの取りこぼしは0件だが、他の観光協会と揃えておく
  # 邑南町（石見9市町の5つ目）。**公式より先に観光協会だけを足している。**
  # 公式は40件中の催しが2〜3件でノイズ率75%、しかも「日時：」を平文で流し込む型で
  # 開催日が取れない。まとめて足すと問題の切り分けができないので分けた。
  # 実データ10件はすべて催しで、イベント以外の混入なし（ノイズ率0%）。
  # 日付は「開催時期」という見出しで書く（`extract.py` の HELD_HEADS /
  # SELF_PERIOD_HEADS。**津和野町観光協会は別の型**なので5町共通ではない）
  - key: ohnan_kanko
    municipality: 邑南町
    site: https://ohnan-kanko.com
    feed_url: https://ohnan-kanko.com/feed
    organizer_type: 観光協会
    trust: high
    # robots.txt が無いので既定の1秒でよい（fetch_delay_sec は書かない）
    feed_pages: 3 # 窓10件（約4か月ぶん）。取りこぼしは実測1件だが、投稿が増えたら効く

  - key: oda_kanko
    municipality: 大田市
    site: https://www.ginzan-wm.jp
    # ?post_type=events_post は効く（10件すべて /events_post/ になる）。
    # ただし**無効な post_type を渡しても200で通常フィードが返る**ので、
    # 状態コードでは効いているか分からない。url_include が保険
    feed_url: https://www.ginzan-wm.jp/feed/?post_type=events_post
    organizer_type: 観光協会
    trust: high
    url_include: '/events_post/'
    # robots.txt に Crawl-delay の宣言なし（宣言しているのは市公式のほう）。
    # 既定の1秒で足りるので fetch_delay_sec は書かない
    feed_pages: 3 # events_post は全15件しかないので、2ページ目で在庫を読み切る
    # **繰り返しの催しは記事を作り直さない。** 毎週の天体観察会・毎月の朝市は
    # 掲載日が何年も前のままなので、既定の400日だと足切りされる。
    # 実測（2026-08-01・在庫15件）: 400日で3件落ち、最古は821日前。ノイズは0件
    # （events_post はイベント専用の投稿タイプなので、そもそも催ししか無い）。
    # 1200日にすると3件とも入る。**この情報源だけ**。全体は400日のまま
    max_age_days: 1200

# 今後の追加候補: 邑南町（公式）/ 川本町 / 美郷町 / 津和野町 / 吉賀町
# 下調べの結果は CLAUDE.md「いま分かっている課題」の残り4町の項にある
