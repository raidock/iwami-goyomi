# 石見イベントコレクター 設定 (Phase 0)
home_base: 浜田

# ---- 公開サイトの設定 --------------------------------------------------
# contact は必ず埋めてください。公開物には連絡先が要ります。
# 「掲載をやめてほしい」という連絡を受ける窓口がないまま公開してはいけません。
site:
  title: 石見暦
  reading: いわみごよみ # 見出しにふりがなを振る（空にすると出ません）
  title_accent: 暦 # この文字だけ石州瓦の色で強調します
  tagline: 石見の催しと締切を、ひとつの暦に。
  # 例: https://<ユーザー名>.github.io/<リポジトリ名>/   OGP画像や共有に使います
  url: 'https://raidock.github.io/iwami-goyomi/'
  # 例: メールアドレス、問い合わせフォームのURL、SNSアカウント
  contact: 'https://forms.gle/5ayQ1xFfUFX9kva69'
  # 運営者の名乗り。公開するなら誰がやっているか示したほうが信頼されます
  operator: 'TandN Design'
region_name: 石見
out_dir: out
data_dir: data # git が保持するのでコードと一緒に動く。GitHub Actions と同じ置き場

# 掲載日がこれより古い記事は捨てる（RSSに古い記事が残り続けるため）。
# 各情報源で max_age_days を書けばそこだけ上書きできる。
# **全体を伸ばさないこと。** 浜田市の公式RSSには2022年のコロナ情報が残っていた。
max_age_days: 400

# 取得の間隔（秒）。相手のサーバに負荷をかけないための待ち時間。全体の既定値。
# 各情報源で fetch_delay_sec を書けばそこだけ上書きできる。
# robots.txt が Crawl-delay を宣言しているサイトは、その値をその情報源にだけ書く
# （全体を上げると関係のない情報源まで遅くなり、収集が終わらなくなる）。
fetch_delay_sec: 1.0

# 石見9市町のうち6市町（浜田・江津・益田・大田・津和野・邑南）が公式まで揃っている。
# 川本町・美郷町は観光協会だけ（公式のフィードが使えない。CLAUDE.md 参照）。残りは吉賀町。
# feed_url を省略するとトップページから自動発見する。
municipalities:
  - key: hamada_city
    municipality: 浜田市
    site: https://www.city.hamada.shimane.jp
    feed_url: https://www.city.hamada.shimane.jp/www/rss/news.rdf
  - key: gotsu_city
    municipality: 江津市
    site: https://www.city.gotsu.lg.jp
    feed_url: https://www.city.gotsu.lg.jp/rss/10/list1.xml # 新着情報（本文の<a>にあり自動発見が届かなかったため明示）
  - key: masuda_city
    municipality: 益田市
    site: https://www.city.masuda.lg.jp
    feed_url: https://www.city.masuda.lg.jp/cgi-bin/feed.php?siteNew=1 # クエリ形式のためFEED_HREF_REに掛からず明示（リンク自体は //host 形式）
  # 邑南町の公式。**観光協会（tourism 側）を先に入れてあるので、ここは追加分。**
  # 江津市と同型（/rss/10/list1.xml）。実測（2026-08-01）: 39件・掲載日あり・
  # ノイズ率76%（行政中心のフィードで、催しは実質9件）。
  # 日付は **`日時：令和8年10月17日（土曜日）` の平文ラベル**で書く
  # （`extract.py` の `_colon_sections`。記号にも【】にも掛からない型）。
  # `?paged=N` は効かない
  - key: ohnan_town
    municipality: 邑南町
    site: https://www.town.ohnan.lg.jp
    feed_url: https://www.town.ohnan.lg.jp/rss/10/list1.xml
  # 津和野町（石見9市町の6つ目）。浜田市と同じCMSで、URLも /www/contents/… の型。
  # **feed_url は必ず書くこと。** 自動発見はトップの <a> から
  # `emergency.rdf`（緊急情報）を拾う。放置すると災害情報だけを集めるサイトになる。
  # 実測（2026-08-01）: news.rdf は21件・掲載日あり・ノイズ率66%（入札案件が7件）。
  # `?paged=N` は効かない（浜田市・江津市・益田市と同じ）ので feed_pages は書かない
  - key: tsuwano_town
    municipality: 津和野町
    site: https://www.town.tsuwano.lg.jp
    feed_url: https://www.town.tsuwano.lg.jp/www/rss/news.rdf
  # ドメインは oda。ohda ではない（www.city.ohda.lg.jp は名前解決できない）
  - key: oda_city
    municipality: 大田市
    site: https://www.city.oda.lg.jp
    # /feed/ は新着フィードではなく**サイト全体の目次**。907件のうち大半が
    # 組織案内などの固定ページで、<pubDate> を1件も持たない。
    # そのため専用アダプター OdaCityRSS が新着一覧HTMLから掲載日を補う
    # （差し替えは main.py の ADAPTERS。詳細は collector/sources/oda_city.py）
    feed_url: https://www.city.oda.lg.jp/feed/
    # 記事だけに絞る。末尾の [^/?#] が索引ページ /update_info/ そのものと
    # ページ送り（?page=2）を外す。記事URLは連番だけでなく /update_info/guidebook
    # のような名前つきもあるので、数字に限定してはいけない（4件取りこぼした）
    url_include: '/update_info/[^/?#]'
    fetch_delay_sec: 5 # robots.txt の Crawl-delay: 5（石見で宣言しているのはここだけ）

# 観光協会。イベント専用のRSSならノイズが少ないので trust: high で扱う。
# （自治体と同じ厳しさで仕分けると、語彙にない催しを取りこぼすため）。
# 店舗情報が混ざる情報源（川本町）は high のまま除外語で落とす（config 内に理由）
tourism:
  - key: hamanavi
    municipality: 浜田市
    site: https://kankou-hamada.or.jp
    feed_url: https://kankou-hamada.or.jp/archives/category/event/feed/
    organizer_type: 観光協会
    trust: high
    # **窓が10件しかなく、投稿が多いので約2週間分しか見えない。**
    # 浜田市最大の祭り（浜っ子夏まつり・7/2投稿）が窓から落ちて載らなかった。
    # 3ページで30件＝約6週間分。負荷は1日2リクエスト増（設計判断12の範囲）
    feed_pages: 3
  - key: gotsu_kanko
    municipality: 江津市
    site: https://www.gotsu-kanko.jp
    organizer_type: 観光協会
    trust: high
    # サイト全体のRSSしかないため、お知らせ記事だけに絞る
    # （/kankou/see/ などの観光スポット紹介ページを除外）
    url_include: '/news/'
    feed_pages: 3 # 窓9件。いまの取りこぼしは0件だが、他の観光協会と揃えておく
  # 邑南町観光協会。**公式より先にこちらだけを足した**（切り分けのため）。
  # 公式（municipalities の ohnan_town）は 2026-08-01 に追加ずみ。
  # 実データ10件はすべて催しで、イベント以外の混入なし（ノイズ率0%）。
  # 日付は「開催時期」という見出しで書く（`extract.py` の HELD_HEADS /
  # SELF_PERIOD_HEADS。**津和野町観光協会は別の型**なので5町共通ではない）
  - key: ohnan_kanko
    municipality: 邑南町
    site: https://ohnan-kanko.com
    feed_url: https://ohnan-kanko.com/feed
    organizer_type: 観光協会
    trust: high
    # robots.txt が無いので既定の1秒でよい（fetch_delay_sec は書かない）
    feed_pages: 3 # 窓10件（約4か月ぶん）。取りこぼしは実測1件だが、投稿が増えたら効く

  # 津和野町観光協会。自動発見が /feed/ を正しく拾うが、明示しておく。
  # 実測（2026-08-01）: 在庫17件・**ノイズ率0%**（3ページ目は404＝読み切り）。
  # タイトルが「【津和野盆踊り】8/15　409回目の夏」の形で、
  # **【…】の直後にスラッシュ日付**が来る（8つ目の日付表記。models.py の _BR）。
  # 本文には日付の見出しが無いページが多く、日付はタイトル頼りになる
  - key: tsuwano_kanko
    municipality: 津和野町
    site: https://tsuwano-kanko.net
    feed_url: https://tsuwano-kanko.net/feed/
    organizer_type: 観光協会
    trust: high
    feed_pages: 3
  # 川本町観光協会。サイト全体のフィードで、店舗の営業案内（ふくむら食堂の
  # 月次営業・弥山荘の休業日・入浴料金変更）・開花状況が定期的に流れる。
  # URLはすべて `/info/2026/post-NNNN/` なので url_include では分けられない。
  #
  # **`trust: high` にしたうえで、店舗情報は除外語で落とす**（2026-08-02）。
  # 一度 normal で入れたが、それだと「梶原徹也と刄田綴色《プロドラマーの
  # 共演》」のような**タイトルに催しの語が無い本物**を取りこぼす。
  # **ノイズは人が n を押せば済むが、取りこぼしは気づけない。**
  # 実測（30件）: normal は auto 4/review 10/drop 16、
  # high＋除外語は auto 9/review 10/**drop 11**。承認の手間は同じで
  # 取りこぼしだけ消える（除外語は classify.py の「店舗・施設の営業案内」）。
  #
  # **公式（town.shimane-kawamoto.lg.jp）はまだ足せない** — フィードが
  # サイト目次で記事URLを1件も持たない。詳しくは CLAUDE.md
  - key: kawamoto_kanko
    municipality: 川本町
    site: https://www.kawamoto-kankou.jp
    feed_url: https://www.kawamoto-kankou.jp/feed/
    organizer_type: 観光協会
    trust: high
    feed_pages: 3
  # 美郷町観光協会（石見9市町の8つ目）。**公式は足さない** — `/feed` は6件で、
  # 実測（2026-08-02）では6件とも掲載日が400日より古く、使えるものが0件だった。
  #
  # `/feed/` はサイト全体で431件（大田市と同じ目次の罠。先頭が「トップ」「お知らせ」）。
  # **掲載日を持つのは40件だけで、それが `/information/` の記事とほぼ一致する。**
  # そこで `/information/` に絞ると38件・全部掲載日あり・ノイズ率2%になる
  # （落ちるのは「年末年始休業日のお知らせ」1件）。町の看板が揃っている
  # （江の川釣り大会・美郷夏まつり花火大会・君谷マーケット・神楽共演大会など）。
  # 末尾の [0-9] は索引ページ `/information/` そのものを外すため。
  # `?paged=N` は効かない
  - key: misato_kanko
    municipality: 美郷町
    site: https://www.misato-kankou.com
    feed_url: https://www.misato-kankou.com/feed/
    organizer_type: 観光協会
    trust: high
    url_include: '/information/[0-9]'
    fetch_delay_sec: 5 # robots.txt の Crawl-delay: 5（**記録では「宣言なし」だったが実際はある**）
  - key: oda_kanko
    municipality: 大田市
    site: https://www.ginzan-wm.jp
    # ?post_type=events_post は効く（10件すべて /events_post/ になる）。
    # ただし**無効な post_type を渡しても200で通常フィードが返る**ので、
    # 状態コードでは効いているか分からない。url_include が保険
    feed_url: https://www.ginzan-wm.jp/feed/?post_type=events_post
    organizer_type: 観光協会
    trust: high
    url_include: '/events_post/'
    # robots.txt に Crawl-delay の宣言なし（宣言しているのは市公式のほう）。
    # 既定の1秒で足りるので fetch_delay_sec は書かない
    feed_pages: 3 # events_post は全15件しかないので、2ページ目で在庫を読み切る
    # **繰り返しの催しは記事を作り直さない。** 毎週の天体観察会・毎月の朝市は
    # 掲載日が何年も前のままなので、既定の400日だと足切りされる。
    # 実測（2026-08-01・在庫15件）: 400日で3件落ち、最古は821日前。ノイズは0件
    # （events_post はイベント専用の投稿タイプなので、そもそも催ししか無い）。
    # 1200日にすると3件とも入る。**この情報源だけ**。全体は400日のまま
    max_age_days: 1200

# 今後の追加候補: 吉賀町（手動掲載で足りるか要判断）/ 川本町・美郷町の公式
# 下調べの結果は CLAUDE.md「いま分かっている課題」の残り町の項にある
