# 石見イベントコレクター 設定 (Phase 0)
home_base: 浜田

# ---- 公開サイトの設定 --------------------------------------------------
# contact は必ず埋めてください。公開物には連絡先が要ります。
# 「掲載をやめてほしい」という連絡を受ける窓口がないまま公開してはいけません。
site:
  title: 石見暦
  reading: いわみごよみ # 見出しにふりがなを振る（空にすると出ません）
  title_accent: 暦 # この文字だけ石州瓦の色で強調します
  tagline: 石見の催しと締切を、ひとつの暦に。
  # 例: https://<ユーザー名>.github.io/<リポジトリ名>/   OGP画像や共有に使います
  url: 'https://raidock.github.io/iwami-goyomi/'
  # 例: メールアドレス、問い合わせフォームのURL、SNSアカウント
  contact: 'https://forms.gle/5ayQ1xFfUFX9kva69'
  # 運営者の名乗り。公開するなら誰がやっているか示したほうが信頼されます
  operator: 'TandN Design'
region_name: 石見
out_dir: out
data_dir: data # git が保持するのでコードと一緒に動く。GitHub Actions と同じ置き場

# 掲載日がこれより古い記事は捨てる（RSSに古い記事が残り続けるため）
max_age_days: 400

# 取得の間隔（秒）。相手のサーバに負荷をかけないための待ち時間。全体の既定値。
# 各情報源で fetch_delay_sec を書けばそこだけ上書きできる。
# robots.txt が Crawl-delay を宣言しているサイトは、その値をその情報源にだけ書く
# （全体を上げると関係のない情報源まで遅くなり、収集が終わらなくなる）。
fetch_delay_sec: 1.0

# Phase 0 は浜田市・江津市の2自治体から。
# feed_url を省略するとトップページから自動発見する。
municipalities:
  - key: hamada_city
    municipality: 浜田市
    site: https://www.city.hamada.shimane.jp
    feed_url: https://www.city.hamada.shimane.jp/www/rss/news.rdf
  - key: gotsu_city
    municipality: 江津市
    site: https://www.city.gotsu.lg.jp
    feed_url: https://www.city.gotsu.lg.jp/rss/10/list1.xml # 新着情報（本文の<a>にあり自動発見が届かなかったため明示）
  - key: masuda_city
    municipality: 益田市
    site: https://www.city.masuda.lg.jp
    feed_url: https://www.city.masuda.lg.jp/cgi-bin/feed.php?siteNew=1 # クエリ形式のためFEED_HREF_REに掛からず明示（リンク自体は //host 形式）

# 観光協会。イベント専用のRSSなのでノイズが少なく、trust: high で扱う。
# （自治体と同じ厳しさで仕分けると、語彙にない催しを取りこぼすため）
tourism:
  - key: hamanavi
    municipality: 浜田市
    site: https://kankou-hamada.or.jp
    feed_url: https://kankou-hamada.or.jp/archives/category/event/feed/
    organizer_type: 観光協会
    trust: high
  - key: gotsu_kanko
    municipality: 江津市
    site: https://www.gotsu-kanko.jp
    organizer_type: 観光協会
    trust: high
    # サイト全体のRSSしかないため、お知らせ記事だけに絞る
    # （/kankou/see/ などの観光スポット紹介ページを除外）
    url_include: '/news/'

# 今後の追加候補: 益田市 / 大田市 / 邑南町 / 川本町 / 美郷町 / 津和野町 / 吉賀町
